name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy churn_radar scripts tests
      # Only checks that the generator runs: NumPy does not promise identical random streams
      # across versions, so the tests use the committed examples/customers.csv.
      - run: python scripts/make_sample.py --out /tmp/customers.csv
      - run: pytest
